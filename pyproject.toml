[project]
name = "merchant-onboarding-agent"
version = "0.1.0"
description = "An agent that helps a payment platform FDE onboard new merchants: mock payment API + MCP server + Claude test agent."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "mcp>=2.0",
    "anthropic[mcp]>=2.0",
    "pytest>=8.0",
    "openai>=1.50",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onboarding"]

[tool.pytest.ini_options]
testpaths = ["tests"]
